function slotOf(n){
 if(/^(helm|visor|bar\d|hole\d|gorget|mail_collar)/.test(n))return'head';
 if(/^pauldron/.test(n))return'shoulders';
 if(/^(upper_mail|rerebrace|couter|elbow_lame|vambrace)/.test(n))return'arms';
 if(/^hand_/.test(n))return'hands';
 if(/^(cuirass|chest_|lame|fauld|belt|tasset|under_tunic)/.test(n))return'chest';
 if(/^(thigh_mail|cuisse|knee|shin|greave)/.test(n))return'legs';
 if(/^sabaton/.test(n))return'feet';
 if(/^cape/.test(n))return'back';
 return null;
}
function applyEquip(){
 if(NOARM)return;                        /* nothing to put on yet */
 if(typeof pl==="undefined"||!pl||!pl.userData.parts)return;
 const U=pl.userData;
 /* walk everything: pieces made while rigging (split mail, inner cape) are not in the registry */
 pl.traverse(o=>{if(!o.isMesh||/^body_/.test(o.name||""))return;
  const sl=slotOf(o.name||"");if(sl)o.visible=!!EQ[sl]});
 if(U.sword)U.sword.visible=!!EQ.main;
 if(U.shield)U.shield.visible=!!EQ.off;
}

 let y=0;for(let i=0;i<len;i++){y=(y+.02*(Math.random()*2-1))/1.02;d[i]=y*3.5}
 const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
 const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=380;lp.Q.value=.7;
 const wg=AC.createGain();wg.gain.value=.5;
 src.connect(lp);lp.connect(wg);wg.connect(AM);src.start();
 const lfo=AC.createOscillator();lfo.frequency.value=.07;const lg=AC.createGain();lg.gain.value=150;
 lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
 [[55,.09],[82.5,.045],[110,.025]].forEach(function(p){const o=AC.createOscillator();o.type="sine";o.frequency.value=p[0];const g=AC.createGain();g.gain.value=p[1];o.connect(g);g.connect(AM);o.start()});

}
function bell(){if(!AC||!BUS)return;const t=AC.currentTime;
 const out=AC.createGain();out.gain.value=1;out.connect(BUS);
 [174,262,349,523].forEach(function(f,i){
  const o=AC.createOscillator();o.type="sine";o.frequency.value=f*(1+(Math.random()-.5)*.004);
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t);

 });
}
let SFXV=1;
function sfxNoise(dur,freq,gain,q,sweep){
 const t=AC.currentTime,gg=gain*SFXV,n=Math.floor(AC.sampleRate*dur),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
 const src=AC.createBufferSource();src.buffer=b;
 const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.setValueAtTime(freq,t);

 }catch(e){}
}
